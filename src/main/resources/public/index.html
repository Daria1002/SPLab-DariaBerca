<html lang="en">
<body>

<h1>All Books (Pushed via SSE)</h1>
<a href="javascript:void(0)" onclick="sendRequest()">Start Listening for New Books</a>
<div id="sseDiv"></div>

<script>
    function sendRequest() {
        const sseDiv = document.getElementById("sseDiv");
        sseDiv.innerHTML = "Listening for new books...";

        if (typeof (EventSource) !== "undefined") {
            // Conectarea la endpoint-ul nostru SSE
            const source = new EventSource(`http://localhost:8080/books-sse`);

            // Acesta este listener-ul. Se va executa de fiecare dată
            // când serverul trimite un mesaj.
            source.onmessage = function (event) {
                // event.data este string-ul JSON trimis de server
                const book = JSON.parse(event.data);
                sseDiv.innerHTML += `<br>New book added: ID=${book.id}, Title=${book.title}`;
            };

            source.onerror = function(err) {
                console.error("EventSource failed:", err);
                sseDiv.innerHTML += "<br>Connection to server lost.";
                source.close();
            };

        } else {
            sseDiv.innerHTML = "Your browser does not support server-sent events.";
        }
    }
</script>

</body>
</html>
